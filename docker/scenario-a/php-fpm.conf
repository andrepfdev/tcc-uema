[www]
user  = www-data
group = www-data

listen = 0.0.0.0:9000

; Pool estático com 4 workers — mesma contagem dos Workers nos Cenários B/C/D
; Variável controlada nos 4 cenários para comparação justa
pm = static
pm.max_children = 4

; Desabilitar logs de acesso do FPM (reduz I/O nas medições)
access.log = /dev/null
